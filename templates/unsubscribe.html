<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataoorts Cloud</title>
    
    <!-- Simple Orbit Favicon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' stroke='%2300f3ff' stroke-width='4' fill='none'/%3E%3Ccircle cx='50' cy='50' r='15' fill='%23ffffff'/%3E%3Ccircle cx='85' cy='50' r='5' fill='%2300f3ff'/%3E%3C/svg%3E" type="image/svg+xml">

    <!-- Fonts: Clean Tech Look -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --accent: #00f3ff; /* Cyber Blue */
            --bg-dark: #080a10;
            --card-bg: rgba(20, 25, 35, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
            position: relative;
        }

        /* --- SUBTLE SPACE BACKGROUND --- */
        /* Space feel without being messy */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1f35 0%, #080a10 80%);
            z-index: -1;
        }

        /* Tiny moving particles for "Space Time" feel */
        .particles {
            position: absolute;
            width: 100%; height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.1;
            animation: drift 60s linear infinite;
        }

        @keyframes drift {
            from { transform: scale(1); }
            to { transform: scale(1.5); }
        }

        /* --- CARD DESIGN --- */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 60px 50px;
            border-radius: 16px;
            width: 550px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        /* Top Blue Glow Line */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            box-shadow: 0 0 15px var(--accent);
        }

        h2.logo {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            font-size: 28px;
            margin-bottom: 10px;
            color: #fff;
        }
        
        p.subtitle {
            color: #8899a6;
            font-size: 14px;
            margin-bottom: 40px;
        }

        /* --- FORM ELEMENTS --- */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            text-align: center;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.15);
        }

        input::placeholder {
            color: #555;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* Message Styling */
        .status-msg {
            margin-top: 20px;
            font-size: 13px;
            padding: 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
        }

    </style>
</head>
<body>

    <!-- Simple Space Background -->
    <div class="stars">
        <div class="particles"></div>
    </div>

    <div class="card">
        <h2 class="logo">DATAOORTS AI Cloud</h2>
        <p class="subtitle">Manage Your Subscription</p>

        <form method="post" action="/unsubscribe">
            <div class="input-group">
                <input type="email" name="email" placeholder="example@email.com" required autocomplete="off" />
            </div>
            
            <button type="submit">Unsubscribe</button>
        </form>

        {% if message %}
            <div class="status-msg">
                {{ message }}
            </div>
        {% endif %}
      
    </div>

    <script>
        if ( window.history.replaceState ) {
            window.history.replaceState( null, null, window.location.href );
        }
    </script>

</body>
</html>
